name: Publish Python 🐍 distribution to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    
    - name: Update version to match release
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "Updating version to $VERSION"
        sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
        grep "^version =" pyproject.toml
        
    - name: Make README links absolute for PyPI
      # PyPI renders the README outside the repository, so pin its relative links to this release tag.
      run: python3 tools/pypi_readme.py --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

    - name: Install pypa/build and twine
      run: >-
        python3 -m pip install build twine --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Check the package description renders on PyPI
      run: python3 -m twine check --strict dist/*
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imap-migration-tools
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
