name: Android

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Test and build Android application
        run: gradle -p android lintDebug testDebugUnitTest assembleDebug bundleDebug

      - name: Validate 16 KB native-library compatibility
        run: |
          tools/check_android_16kb.sh android/app/build/outputs/apk/debug/app-debug.apk
          tools/check_android_16kb.sh android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Enforce Android size budget
        run: tools/check_android_size.sh android/app/build/outputs/bundle/debug/app-debug.aab 50

      - uses: actions/upload-artifact@v7
        with:
          name: imap-tools-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
