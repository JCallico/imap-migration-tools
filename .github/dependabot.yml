version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/tools/agent_loop"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
